<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ģitāras stunda</title>
<meta name="theme-color" content="#0C0907">
<meta name="description" content="Personīgs ģitāras treniņu plānotājs ar rīkiem un skaņotāju.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one dark "boutique amp room" look. The photos set the mood at the top of Today and behind the session;
   everything else is quiet warm-black panels with brass details. Colour stays reserved for the five practice blocks. */
:root{
  color-scheme:dark;
  --bg:#0C0907; --surface:#17110D; --raised:#211913; --well:#100B08; --sunken:#2A2019; --ink:#F2E4CF; --muted:#A8937D; --line:#33281F; --on-ink:#170F08;
  --brass:#E2A64F; --brass-hi:#F6CF86; --brass-lo:#A86F25; --glow:rgb(255 168 72 / .45); --tube-blue:#7FA4FF;
  --panel-hi:#1E1712; --panel-lo:#140F0B;
  --c-tech:#4F86E8; --c-fret:#DB6A2E; --c-theory:#18A08A; --c-rep:#8D72E6; --c-comp:#C08525;
  --good:#6CC98F; --bad:#F07A62;
  --fb-fret:#C9C1B3; --fb-string:#DDD6CA; --fb-wound:#C9B48F; --fb-inlay:#E9E1D2; --fb-nut:#EDE3CF;
  --fb-dot:#F1E7D6; --fb-dot-ink:#1A120C; --fb-root:#F5B547; --fb-third:#5FD4C0; --fb-fifth:#F58BB8; --fb-seventh:#B3A2FF; --fb-char:#7FA4FF;--fb-ext:#A6DB7E;--fb-ok:#6BE09A; --fb-bad:#FF8E7A;
  --f-display:'Literata',Georgia,'Times New Roman',serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(120% 50% at 50% -8%,rgb(255 160 70 / .06),transparent 60%) no-repeat,var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.in-session{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:10px 104px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:11px;font:600 21px/1 var(--f-display);letter-spacing:-.01em}
.brand img{width:34px;height:34px;border-radius:9px;flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgb(14 10 8 / .94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 2px;border-radius:12px;font:500 11px/1.2 var(--f-body);color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--brass-hi);font-weight:600}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{font:600 26px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h3{font:600 18px/1.25 var(--f-display);letter-spacing:-.005em}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.lede,.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,var(--panel-hi),var(--panel-lo));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:inset 0 1px 0 rgb(255 230 190 / .05)}
.stack-v{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--brass-lo)}
.btn.solid{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 48%,var(--brass-lo));color:var(--on-ink);border-color:var(--brass-lo);box-shadow:inset 0 1px 0 rgb(255 240 210 / .5),0 8px 24px -10px var(--glow)}
.btn.solid:hover{filter:brightness(1.06)}
.btn.sm{min-height:34px;padding:6px 13px;font-size:13px}
.btn.lg{min-height:52px;padding:12px 24px;font-size:16px;width:100%}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--brass-hi)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--well);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--brass-hi);box-shadow:inset 0 0 0 1px var(--line)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
.field input,.field textarea,.field select,select.sel{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px;color:var(--ink);font-weight:400;min-width:0;width:100%}
select.sel{width:auto;max-width:100%}
.field textarea{min-height:76px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-size:12px;font-weight:600}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip.plain::before{display:none}

/* Today */
.hero{position:relative;isolation:isolate;overflow:hidden;margin-inline:-16px;min-height:min(176vw,820px);padding:14px 16px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.hero .bgimg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:60% 100%}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgb(12 9 7 / .6) 0%,rgb(12 9 7 / .05) 38%,rgb(12 9 7 / .05) 52%,rgb(12 9 7 / .82) 78%,var(--bg) 100%)}
.hero-main{display:flex;flex-direction:column;align-items:center;gap:8px}
.hero-side{display:flex;flex-direction:column;gap:16px}
.ringwrap{position:relative;width:min(232px,60vw);aspect-ratio:1}
.ring{width:100%;height:100%;display:block}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.ringmid .big{font:700 66px/0.9 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-shadow:0 0 28px var(--glow)}
.ringmid .of{font-size:13px;color:var(--muted)}
.herostats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.herostats b{display:block;font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.herostats span{font-size:12px;color:var(--muted)}
.today-body{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:6px}
.week{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.week-bars{position:relative;height:96px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;border-bottom:1px solid var(--line)}
.week-goal{position:absolute;left:0;right:0;border-top:1px dashed var(--brass-lo);opacity:.8;pointer-events:none}
.week-goal span{position:absolute;right:0;top:-15px;font:400 10px/1 var(--f-mono);color:var(--muted)}
.wstack{height:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:2px;max-width:24px;width:100%;margin-inline:auto}
.wstack i{display:block;min-height:2px}
.wstack i:last-child{border-radius:4px 4px 0 0}
.week-lab{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:11px;color:var(--muted)}
.week-lab .is-today{color:var(--brass-hi);font-weight:600}
.plan-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.blocks{display:flex;flex-direction:column}
.blk{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:14px;border-top:1px solid var(--line)}
.blk:last-child{border-bottom:1px solid var(--line)}
.blk-ico{width:48px;height:48px;border-radius:12px;display:block}
.blk-head{display:flex;align-items:center;gap:8px;font-size:13px}
.blk-head .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.blk-name{font-weight:600;color:var(--muted)}
.blk-min{color:var(--muted);font-family:var(--f-mono);font-size:12px;margin-left:auto}
.blk-ex{font:600 17px/1.3 var(--f-display);margin-block:3px 8px;overflow-wrap:anywhere}
.bar{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:2px;box-shadow:0 0 8px var(--c)}
.blk-act{display:flex;gap:6px;flex-direction:column}
.blk.done .blk-min{color:var(--good)}

/* Session */
.session{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-x:hidden;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.session::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgb(12 9 7 / .66),rgb(12 9 7 / .9) 55%,rgb(12 9 7 / .96)),url(img/tubes.webp) center 30% / cover no-repeat}
.s-inner{position:relative;z-index:1;max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.s-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.s-chip{padding:4px 12px 4px 4px;font-size:13px}
.s-chip::before{display:none}
.s-chip img{width:26px;height:26px;border-radius:7px}
.s-prog{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden}
.s-prog i{display:block;height:100%;background:var(--c);width:0;box-shadow:0 0 10px var(--c)}
.s-timer{text-align:center;padding-top:8px}
.s-time{font:500 clamp(58px,19vw,96px)/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--brass-hi);text-shadow:0 0 22px var(--glow),0 0 3px rgb(255 200 120 / .6)}
.s-sub{color:var(--muted);font-size:13px;margin-top:6px}
.s-ctl{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.s-ctl .btn{min-height:50px;font-size:15px}
.how{display:flex;flex-direction:column;gap:8px;counter-reset:how;margin-top:10px}
.how li{counter-increment:how;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;max-width:62ch}
.how li::before{content:counter(how);font:500 12px/1.9 var(--f-mono);color:var(--brass)}
.note{background:rgb(33 25 19 / .8);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.bpmlog{display:flex;flex-direction:column;gap:8px}
.bpmlog .val{font:500 22px/1 var(--f-mono);color:var(--brass-hi)}
.s-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.s-main{display:flex;flex-direction:column;gap:18px;min-width:0}

/* Metronome */
.metro{display:flex;flex-direction:column;gap:16px}
.m-head{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center}
.knob{width:118px;height:118px;touch-action:none;cursor:ns-resize;border-radius:50%;user-select:none;-webkit-user-select:none}
.knob svg{width:100%;height:100%;display:block}
.m-read{display:flex;flex-direction:column;gap:10px;min-width:0}
.m-bpm{display:flex;align-items:baseline;gap:8px}
.m-bpm b{font:500 50px/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--brass-hi);text-shadow:0 0 16px var(--glow)}
.m-bpm small{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.m-steps{display:flex;gap:6px;flex-wrap:wrap}
.m-step{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font:500 13px/1 var(--f-mono)}
.m-step:hover{border-color:var(--brass-lo)}
.m-bot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.m-dots{display:flex;gap:8px;margin-right:auto}
.m-dots i{width:15px;height:15px;border-radius:50%;background:#2A1E14;border:1px solid #3A2C20}
.m-dots i.hit{background:radial-gradient(circle at 50% 40%,#FFE3AE,#F29A3A 58%,#9A4E12);border-color:#F2A54A;box-shadow:0 0 12px 3px var(--glow)}
.m-dots i:first-child.hit{background:radial-gradient(circle at 50% 40%,#E3EBFF,#7FA4FF 58%,#2E4FA8);border-color:#9DB8FF;box-shadow:0 0 12px 3px rgb(127 164 255 / .5)}
.m-vol{display:grid;grid-template-columns:auto minmax(0,1fr) 46px;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.m-vol input{width:100%;accent-color:var(--brass)}
.m-vol .num{text-align:right;font-size:12px}

/* Fretboard */
.fbwrap{overflow-x:auto;border-radius:10px;padding-bottom:2px}
.fb{width:100%;height:auto;display:block}
.fb .lab{fill:var(--muted);font:500 10px var(--f-mono)}
.fb .d circle{fill:var(--fb-dot)}
.fb .d text{fill:var(--fb-dot-ink);font:700 10.5px var(--f-body);text-anchor:middle}
.fb .d-root circle,.fb .d-q circle{fill:var(--fb-root);filter:drop-shadow(0 0 4px rgb(245 181 71 / .75))}
.fb .d-third circle{fill:var(--fb-third)}
.fb .d-ghost circle{fill:rgb(12 9 7 / .55);stroke:var(--fb-dot);stroke-width:1.5;stroke-dasharray:3 2.2}
.fb .d-ghost text{fill:var(--fb-dot);opacity:.85}
.legend i.lg-ghost{background:none;border:1.5px dashed var(--fb-dot);box-sizing:border-box}
.fb .d-ext circle{fill:var(--fb-ext)}
.fb .d-char circle{fill:var(--fb-char);filter:drop-shadow(0 0 5px rgb(127 164 255 / .8))}
.spell span.char{border-color:var(--fb-char);box-shadow:0 0 10px -3px rgb(127 164 255 / .8)}
.spell span.char small{color:var(--fb-char)}
.fb .d-fifth circle{fill:var(--fb-fifth)}
.fb .d-seventh circle{fill:var(--fb-seventh)}
.fb .d-ok circle{fill:var(--fb-ok);filter:drop-shadow(0 0 4px rgb(107 224 154 / .7))}
.fb .d-bad circle{fill:var(--fb-bad)}
.fb .hit{fill:transparent;cursor:pointer}
.fb .hit:hover{fill:rgb(255 240 220 / .08)}
.fb .mute{fill:var(--muted);font:600 14px var(--f-body);text-anchor:middle}
.fb .shape{fill:none;stroke:var(--fb-dot);stroke-width:2;opacity:.45;stroke-linejoin:round}

/* Trainer + map */
.opts{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.strs{display:inline-flex;gap:4px}
.strs button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font:500 13px/1 var(--f-mono);color:var(--muted)}
.strs button[aria-pressed="true"]{background:linear-gradient(180deg,var(--brass-hi),var(--brass-lo));color:var(--on-ink);border-color:var(--brass-lo)}
.tr-q{font:600 21px/1.25 var(--f-display);min-height:50px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr-q .ok{color:var(--good)} .tr-q .bad{color:var(--bad)}
.tr-big{font:700 88px/1 var(--f-display);letter-spacing:-.03em;text-align:center;color:var(--brass-hi);text-shadow:0 0 30px var(--glow)}
.tr-ans{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.tr-ans button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:14px}
.tr-ans button:hover{border-color:var(--brass-lo);color:var(--brass-hi)}
.tr-score{font-size:13px;color:var(--muted)}
.spell{display:flex;flex-wrap:wrap;gap:6px}
.spell span{display:flex;flex-direction:column;align-items:center;min-width:42px;padding:6px 8px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-weight:600}
.spell small{font:400 11px/1.3 var(--f-mono);color:var(--brass)}
.shapes{display:flex;flex-direction:column;gap:4px;font-size:13px}
.shapes b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

@media (max-width:879px){.toolseg{display:grid;grid-template-columns:1fr 1fr;border-radius:18px;width:100%}.toolseg button{border-radius:14px}.toolseg button:last-child:nth-child(odd){grid-column:1/-1}}
/* Circle of fifths */
.cf{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.cf-svg{width:100%;max-width:440px;display:block}
.cs path{fill:var(--well);stroke:var(--bg);stroke-width:2;cursor:pointer}
.cs:hover path{filter:brightness(1.35)}
.cs text{fill:var(--muted);font:600 15px var(--f-display);text-anchor:middle;pointer-events:none}
.cs-i text{font-size:12.5px}
.cs text.rn{font:500 9.5px var(--f-mono)}
.cs-dia path{fill:color-mix(in srgb,var(--brass) 22%,var(--well))}
.cs-dia text{fill:var(--ink)} .cs-dia text.rn{fill:var(--brass-hi)}
.cs-tonic path{fill:var(--brass)} .cs-tonic text{fill:var(--on-ink)}
.cs-char path{fill:color-mix(in srgb,var(--tube-blue) 42%,var(--well))}
.cs-char text{fill:#E3EBFF} .cs-char text.rn{fill:#C9D7FF}
.cf-svg.sev .cs-o text{font-size:13px} .cf-svg.sev .cs-i text{font-size:10.5px} .cf-svg.sev text.rn{font-size:8.5px}
.cs path{transition:fill .35s}
.cf-bright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.cf-lamps{display:flex;gap:6px}
.cf-lamps i{width:12px;height:12px;border-radius:50%;background:#2A1E14;border:1px solid #3A2C20}
.cf-lamps i.on{background:radial-gradient(circle at 50% 40%,#FFE3AE,#F29A3A 58%,#9A4E12);border-color:#F2A54A;box-shadow:0 0 8px 2px var(--glow)}
.cchip.char{border-color:var(--tube-blue)} .cchip.char small{color:var(--tube-blue)}
.cs-col path{fill:color-mix(in srgb,var(--tube-blue) 16%,var(--well))}
.cs-col text{fill:#C9D7FF} .cs-col text.rn{fill:var(--tube-blue)}
.cs.sel path{stroke:var(--brass-hi);stroke-width:3}
.cf-c1{fill:var(--brass-hi);font:700 30px var(--f-display)}
.cf-c2{fill:var(--ink);font:500 13px var(--f-body)}
.cf-c3{fill:var(--muted);font:500 11px var(--f-mono)}
.cf-big{font:700 34px/1 var(--f-display);color:var(--brass-hi)}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips .btn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass-hi)}
.cchip{display:inline-flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font:600 15px/1.2 var(--f-display);color:var(--ink)}
.cchip small{font:500 10px/1.3 var(--f-mono);color:var(--brass)}
button.cchip:hover{border-color:var(--brass-lo)}
.cchip.out{border-style:dashed;opacity:.85} .cchip.out small{color:var(--muted)}
.cchip.col{border-color:rgb(127 164 255 / .45)} .cchip.col small{color:var(--tube-blue)}
.cchip.now{border-color:var(--brass-hi);box-shadow:0 0 14px -2px var(--glow)}

/* Tuner */
.tu{max-width:560px}
.tu-read{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tu-note{font:700 112px/1 var(--f-display);color:var(--brass-hi);text-shadow:0 0 30px var(--glow);letter-spacing:-.03em;min-height:112px;transition:opacity .3s}
.tu-note sub{font-size:30px;color:var(--muted);text-shadow:none;margin-left:4px;vertical-align:baseline}
.tu-note.idle{opacity:.35}
.tu-hz{font:500 14px/1 var(--f-mono);color:var(--muted)}
.tu-meter{width:100%;display:block}
.tu-meter .tu-tick{stroke:var(--muted);stroke-width:1.5;opacity:.7}
.tu-meter .tu-tick.major{stroke-width:2.2;opacity:1}
.tu-meter text{fill:var(--muted);font:500 11px var(--f-mono);text-anchor:middle}
.tu-needle{transform-origin:160px 168px;transition:transform .12s linear}
.tu-needle line{stroke:var(--brass-hi);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--glow))}
.tu-state{display:flex;align-items:center;justify-content:center;gap:12px;min-height:36px}
.tu-lamp{width:18px;height:18px;border-radius:50%;background:#2A1E14;border:1px solid #3A2C20;transition:background .2s,box-shadow .2s}
.tu-lamp.on{background:radial-gradient(circle at 50% 40%,#E6FFEF,var(--good) 58%,#1E7A47);border-color:var(--good);box-shadow:0 0 14px 4px rgb(108 201 143 / .55)}
.tu-cents{font:500 24px/1 var(--f-mono);min-width:96px;text-align:center}
.tu-hint{font-weight:600;color:var(--muted);min-width:120px}
.tu-hint.ok{color:var(--good)}
.tu-level{height:4px;width:100%;border-radius:2px;background:var(--well);overflow:hidden}
.tu-level i{display:block;height:100%;width:0;background:var(--brass);transition:width .08s}
.tu-strings{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tu-strings button{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 18px/1.1 var(--f-display)}
.tu-strings button small{font:500 10px/1 var(--f-mono);color:var(--muted)}
.tu-strings button.near{border-color:var(--brass);box-shadow:0 0 12px -3px var(--glow)}
.tu-strings button[aria-pressed="true"]{background:linear-gradient(180deg,var(--brass-hi),var(--brass-lo));color:var(--on-ink);border-color:var(--brass-lo)}
.tu-strings button[aria-pressed="true"] small{color:var(--on-ink)}
.tu-ref{display:flex;align-items:center;gap:6px;font:500 13px var(--f-mono);color:var(--muted)}
.tu-ref button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font:500 14px var(--f-mono)}
.tu-err{color:var(--bad);font-size:14px}
@media (prefers-reduced-motion:reduce){.tu-needle,.tu-lamp,.tu-level i,.tu-note{transition:none}}

/* Path */
.stage{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 16px;padding-block:22px;border-top:1px solid var(--line)}
.stage:last-child{border-bottom:1px solid var(--line)}
.badge{width:84px;height:84px;mix-blend-mode:lighten;filter:grayscale(1) brightness(.42) contrast(1.15);transition:filter .3s}
.stage.cur .badge{filter:drop-shadow(0 0 14px rgb(255 168 72 / .35))}
.stage.done .badge{filter:none}
.stage-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;max-width:66ch}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--brass)}
.check .auto{width:18px;height:18px;margin-top:2px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:11px;line-height:1}
.check .auto.pass{background:var(--good);border-color:var(--good);color:var(--on-ink)}
.check small{display:block;color:var(--muted);font-size:12px}

/* Works */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.piece{padding-block:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.piece-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.sec{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-size:13px;font-weight:500}
.sec small{font:400 11px/1 var(--f-mono);color:var(--muted)}
.sec[data-st="1"]{border-color:var(--c-fret)} .sec[data-st="2"]{border-color:var(--c-theory)}
.sec[data-st="3"]{background:linear-gradient(180deg,var(--brass-hi),var(--brass-lo));color:var(--on-ink);border-color:var(--brass-lo)} .sec[data-st="3"] small{color:inherit;opacity:.75}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.idea{padding-block:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.idea p{max-width:66ch;overflow-wrap:anywhere}

/* History */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:linear-gradient(180deg,var(--panel-hi),var(--panel-lo));border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:600 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--brass-hi)}
.stat span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;width:max-content;max-width:100%}
.heat i,.heat-leg i{width:16px;height:16px;border-radius:4px;background:var(--sunken);display:inline-block}
.heat-leg i{width:12px;height:12px;border-radius:3px}
.heat .l1,.heat-leg .l1{background:color-mix(in srgb,var(--brass) 25%,var(--sunken))}
.heat .l2,.heat-leg .l2{background:color-mix(in srgb,var(--brass) 48%,var(--sunken))}
.heat .l3,.heat-leg .l3{background:color-mix(in srgb,var(--brass) 74%,var(--sunken))}
.heat .l4,.heat-leg .l4{background:var(--brass-hi);box-shadow:0 0 6px var(--glow)}
.heat i.fut{background:none;box-shadow:none}
.heat-leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:8px}
.hbar{display:grid;grid-template-columns:104px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;padding-block:5px}
.hbar .track{height:10px;display:flex}
.hbar .track i{display:block;height:100%;background:var(--c);border-radius:0 4px 4px 0;min-width:2px}
.hbar .v{text-align:right;font:400 12px/1 var(--f-mono);color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.num,.tbl th.num{text-align:right;padding-left:12px;padding-right:0;white-space:nowrap}
.tbl td.day{font-family:var(--f-mono);white-space:nowrap;padding-right:12px}
.tblwrap{overflow-x:auto}
.bpmrow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line);font-size:14px}
.bpmrow svg{width:96px;height:28px;display:block}
.bpmrow .v{font:500 13px/1.2 var(--f-mono);white-space:nowrap}
.empty{color:var(--muted);padding-block:10px;max-width:60ch}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--raised);color:var(--ink);border:1px solid var(--brass-lo);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;width:max-content;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 30px rgb(0 0 0 / .5),0 0 18px -6px var(--glow)}
section.view{display:flex;flex-direction:column;gap:22px}
.viewhead{display:flex;flex-direction:column;gap:4px;max-width:66ch}

@media (min-width:880px){
  .app{padding-block:18px 56px}
  .tabs{position:static;border:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;gap:4px}
  .tabs button{flex:none;flex-direction:row;gap:8px;padding:9px 14px;font-size:14px}
  .tabs button[aria-current="page"]{background:var(--raised)}
  .tabs svg{width:18px;height:18px}
  .hero{margin-inline:0;border-radius:24px;min-height:460px;flex-direction:row;align-items:center;justify-content:flex-start;gap:44px;padding:40px 48px;border:1px solid var(--line)}
  .hero .bgimg{object-position:70% 60%}
  .hero::after{background:linear-gradient(90deg,rgb(12 9 7 / .88) 0%,rgb(12 9 7 / .55) 38%,rgb(12 9 7 / 0) 66%)}
  .hero-main{align-items:flex-start;gap:14px}
  .hero-side{width:320px}
  .herostats{text-align:left}
  .ringwrap{width:248px}
  .today-body{grid-template-columns:minmax(0,1fr) 330px;gap:40px;align-items:start;margin-top:12px}
  .blk-act{flex-direction:row}
  .s-inner{grid-template-columns:380px minmax(0,1fr);gap:36px;align-items:start}
  .s-top{grid-column:1/-1}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px;align-items:start}
  .stats{grid-template-columns:repeat(4,1fr)}
  .cf{grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:40px;align-items:start}
  .toast{bottom:28px}
  .hist-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;align-items:start}
}
@media (prefers-reduced-motion:no-preference){
  .bar i,.s-prog i{transition:width .3s}
  .btn,.seg button,.tabs button{transition:background-color .15s,border-color .15s,color .15s}
  .m-dots i{transition:background .08s,box-shadow .12s}
}

  phrygDom:{n:'frīģiskais dominantais',g:'m',o:'Frīģiskais dominantais · minors ar ♭2 un 3',ref:'minor',cmpn:'dabisko minoru',refg:'dabiskā minora',ch:['♭2','3'],chx:'♭2 un lielā terca (3) atšķir šo gammu no dabiskā minora.',f:[[1,0],[2,1],[3,4],[4,5],[5,7],[6,8],[7,10]]},

function spell(rootPc,kind){
  const f=KINDS[kind].f, minorish=f.some(([d,s])=>d===3&&s===3);
  let best=null;
  for(const [li,ra] of ROOTS[rootPc]){
    let cost=0;
    const notes=f.map(([d,s])=>{
      const l=(li+d-1)%7; let a=((rootPc+s-NAT[l])%12+12)%12; if(a>6)a-=12;
      cost+=Math.abs(a)+(Math.abs(a)>1?3:0);
      return {pc:(rootPc+s)%12,name:LET[l]+acc(a),deg:acc(s-NAT[(d-1)%7]-12*Math.floor((d-1)/7))+d,d,semi:s};
    });
    if((ra<0&&minorish)||(ra>0&&!minorish)) cost-=0.5;
    if(!best||cost<best.cost) best={cost,notes};
  }
  return best.notes;
}
function triadShapes(rootPc,kind,low,maxF){
  const t=spell(rootPc,kind); if(t.length!==3) return [];
  const names=['Pamatveids','1. apvērsums','2. apvērsums'], res=[];
  for(let inv=0;inv<3;inv++){
    const o=[t[inv],t[(inv+1)%3],t[(inv+2)%3]];
    for(let f0=0;f0<=maxF;f0++){
      if((TUNE[low]+f0)%12!==o[0].pc) continue;
      const m0=TUNE[low]+f0, m1=m0+((o[1].pc-o[0].pc+12)%12), m2=m1+((o[2].pc-o[1].pc+12)%12);
      const f1=m1-TUNE[low+1], f2=m2-TUNE[low+2];
      if(f1<0||f2<0||f1>maxF||f2>maxF) continue;
      res.push({inv,name:names[inv],cells:[{s:low,f:f0,t:o[0]},{s:low+1,f:f1,t:o[1]},{s:low+2,f:f2,t:o[2]}]});
    }
  }
  return res.sort((a,b)=>a.cells[0].f-b.cells[0].f);
}
function spellL(li,rootPc,kind){return KINDS[kind].f.map(([d,s])=>{const l=(li+d-1)%7;let a=((rootPc+s-NAT[l])%12+12)%12;if(a>6)a-=12;return {pc:(rootPc+s)%12,name:LET[l]+acc(a),d,deg:acc(s-NAT[(d-1)%7]-12*Math.floor((d-1)/7))+d}})}
const CIRC=[0,7,2,9,4,11,6,1,8,3,10,5];
const CIRC_MAJ=['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'];
const CIRC_MIN=['A','E','B','F♯','C♯','G♯','E♭','B♭','F','C','G','D'];
const CIRC_SIG=['bez zīmēm','1 ♯','2 ♯','3 ♯','4 ♯','5 ♯','6 ♯ vai 6 ♭','5 ♭','4 ♭','3 ♭','2 ♭','1 ♭'];
const cIdx=pc=>(pc*7)%12;

 {id:'t6',b:'tech',st:1,bpm:100,t:'Bugī rifs ar klusināšanu',how:['A5: atvērta 5. stīga kopā ar 4. stīgas 2. ladu. Astotdaļas, tikai sitieni uz leju.','Uz 2. un 4. sitiena 2. lada vietā spēlē 4. ladu (A6).','Labās rokas mala viegli klusina stīgas pie tiltiņa.','Tas pats no D (4. un 3. stīga) un no E (6. un 5. stīga).']},
 {id:'t7',b:'tech',st:2,bpm:70,t:'G mažors, 3 notis uz stīgas',tool:mp([7,'major']),how:['6. stīga: ladi 3-5-7. 5. stīga: 3-5-7. 4. stīga: 4-5-7.','3. stīga: 4-5-7. 2. stīga: 5-7-8. 1. stīga: 5-7-8.','Mainīgie sitieni, trīs notis uz sitienu, uz augšu un atpakaļ.']},
 {id:'t8',b:'tech',st:3,bpm:70,t:'Trijskaņu arpedžo pa trim stīgām',tool:mp([0,'maj',1,'d']),how:['Kartē redzamas C mažora trijskaņa formas uz 1-2-3 stīgām.','Katru formu spēlē pa vienai notij uz augšu un atpakaļ.','Bez pauzes pārej uz nākamo formu augstāk pa grifu.']},
 {id:'t9',b:'tech',st:4,bpm:0,tool:{k:'metro',bpm:80,beats:4},t:'Ritms ar pauzēm',how:['Metronoms 80 BPM. Viens akords: E5.','1. takts: sitieni uz 1 un 3. 2. takts: sitieni uz „un” pēc 2 un pēc 4.','Starp sitieniem pilnīgs klusums. Klusini ar abām rokām.']},
 /* --- Grifs --- */
 {id:'f1',b:'fret',st:1,t:'Notis uz 6. stīgas',tool:tr('name',[1,0,0,0,0,0]),how:['Trenažieris rāda vietu uz grifa, tu izvēlies noti.','Sāc bez diēziem un bemoliem. Kad precizitāte pārsniedz 90 %, ieslēdz tos.','Beigās paņem ģitāru un to pašu nospēlē, nosaucot notis skaļi.']},
 {id:'f2',b:'fret',st:1,t:'Notis uz 5. stīgas',tool:tr('name',[0,1,0,0,0,0]),how:['Tas pats, kas ar 6. stīgu.','Ievēro: 5. stīgas nots ir tā pati, kas 6. stīgā piecus ladus tālāk.','Beigās nospēlē uz ģitāras, nosaucot notis skaļi.']},
 {id:'f3',b:'fret',st:1,t:'6. un 5. stīga: atrodi noti',tool:tr('find',[1,1,0,0,0,0]),how:['Trenažieris nosauc noti un stīgu, tu pieskaries pareizajam ladam.','Skaties uz reakcijas laiku: mērķis ir zem 3 sekundēm.']},
 {id:'f4',b:'fret',st:1,t:'Oktāvu formas',tool:mp([7,'note']),how:['No 6. vai 5. stīgas: tā pati nots ir divas stīgas augstāk un divus ladus tālāk.','No 4. vai 3. stīgas: divas stīgas augstāk un trīs ladus tālāk.','Atrodi visus G pa grifu, izmantojot tikai šīs divas formas. Tad D, A un C.']},
 {id:'f5',b:'fret',st:1,t:'Viena nots uz visām stīgām',tool:tr('drill',[1,1,1,1,1,1]),how:['Ieslēdz metronomu uz 60 BPM. Ekrānā parādās nots.','Nospēlē to uz katras stīgas no 6. līdz 1., viena nots uz sitienu.','Pēc astoņiem sitieniem nāk nākamā nots.']},
 {id:'f6',b:'fret',st:1,t:'Notis uz 4. un 3. stīgas',tool:tr('name',[0,0,1,1,0,0]),how:['Oktāvu forma: 6. stīgas nots atkārtojas uz 4. stīgas divus ladus tālāk.','5. stīgas nots tāpat atkārtojas uz 3. stīgas divus ladus tālāk.']},
 {id:'f7',b:'fret',st:1,t:'Notis uz 2. un 1. stīgas',tool:tr('name',[0,0,0,0,1,1]),how:['1. stīgas notis ir tās pašas, kas 6. stīgā.','5. stīgas nots atkārtojas uz 2. stīgas divus ladus tuvāk galviņai.']},
 {id:'f8',b:'fret',st:1,t:'Viss grifs: atrodi noti',tool:tr('find',[1,1,1,1,1,1]),how:['Visas sešas stīgas.','Trenažieris biežāk jautā vietas, kur kļūdies vai domā ilgāk.']},
 {id:'f9',b:'fret',st:2,t:'Pamattoņi pentatonikas pozīcijās',tool:mp([9,'minPent',0,'d']),how:['Kartē A minora pentatonika ar pakāpēm.','Katrā no piecām pozīcijām atrodi visus pamattoņus (1).','Spēlē pozīciju un apstājies tikai uz pamattoņa.']},
 {id:'f10',b:'fret',st:2,t:'Viss grifs ar diēziem un bemoliem',tool:tr('name',[1,1,1,1,1,1],{acc:true}),how:['Visas stīgas, visas 12 notis.','Vienai vietai ir divi nosaukumi: F♯ un G♭ ir viena un tā pati skaņa.']},
 {id:'f11',b:'fret',st:3,t:'Terca un kvinta ap pamattoni',tool:mp([0,'maj',0,'d'],[9,'min',0,'d']),how:['Kartē C mažora trijskanis pa visu grifu.','No katra C atrodi tuvāko tercu (E) un kvintu (G).','Pārslēdz uz A minoru un atkārto.']},
 /* --- Teorija --- */
 {id:'h1',b:'theory',st:1,t:'12 notis un divi izņēmumi',how:['Starp blakus notīm ir diēzs vai bemols, izņemot E–F un B–C.','Uz 6. stīgas spēlē pa vienam ladam no atvērtas stīgas līdz 12. ladam un nosauc katru noti.','Tas pats uz 5. stīgas. 12. ladā nots atkārtojas oktāvu augstāk.']},
 {id:'h2',b:'theory',st:1,t:'C mažors pa vienu stīgu',tool:mp([0,'major']),how:['Uz 2. stīgas: ladi 1, 3, 5, 6, 8, 10, 12, 13.','Soļi starp notīm: tonis, tonis, pustonis, tonis, tonis, tonis, pustonis. Tā ir mažora formula.','Nosauc katru noti. Tad to pašu formulu sāc no G uz 1. stīgas 3. lada.']},
 {id:'h3',b:'theory',st:1,t:'Pentatonika ar nosaukumiem',tool:mp([9,'minPent']),how:['A minora pentatonika, 1. pozīcija.','Spēlē lēni un pirms katras nots nosauc to: A, C, D, E, G.','Aizver acis un pasaki, uz kuras stīgas un lada ir katrs A.']},
 {id:'h4',b:'theory',st:2,t:'Mažora pentatonika plus divas notis',tool:mp([0,'majPent',0,'d'],[0,'major',0,'d']),how:['C mažora pentatonika: C, D, E, G, A. Pakāpes 1, 2, 3, 5, 6.','Pieliec F (4) un B (7), un sanāk pilns C mažors.','Pārslēdz karti starp abām un atrodi jaunās notis katrā pozīcijā.']},
 {id:'h5',b:'theory',st:2,t:'Minora pentatonika plus divas notis',tool:mp([9,'minPent',0,'d'],[9,'minor',0,'d']),how:['A minora pentatonika: A, C, D, E, G. Pakāpes 1, ♭3, 4, 5, ♭7.','Pieliec B (2) un F (♭6), un sanāk dabiskais A minors.','Spēlē pentatonikas frāzi un beigās apzināti trāpi uz B vai F.']},
 {id:'h6',b:'theory',st:2,t:'Paralēlās tonalitātes',tool:mp([0,'major'],[9,'minor']),how:['C mažors un A minors sastāv no tām pašām notīm. Atšķiras tikai tas, kura nots ir mājas.','Minora pamattonis ir mažora 6. pakāpe: trīs ladus zem mažora pamattoņa.','Atrodi paralēlo minoru G, D, A un E mažoram: Em, Bm, F♯m, C♯m.']},
 {id:'h7',b:'theory',st:2,t:'Intervāli no pamattoņa',tool:mp([0,'major',0,'d']),how:['Kartē C mažors ar pakāpēm.','No C uz 5. stīgas 3. lada atrodi katru pakāpi un nosauc intervālu: sekunda, terca, kvarta, kvinta, seksta, septima.','Lielā terca ir vienu stīgu augstāk un vienu ladu atpakaļ. Kvinta ir vienu stīgu augstāk un divus ladus tālāk.','Pārejā no 3. uz 2. stīgu viss nobīdās par vienu ladu tālāk.']},
 {id:'h8',b:'theory',st:3,t:'Kā uzbūvēts trijskanis',tool:mp([0,'maj',0,'d'],[0,'min',0,'d']),how:['Trijskanis ir gammas 1., 3. un 5. pakāpe. C mažorā: C, E, G.','Mažora trijskanis: lielā terca (4 ladi) un virs tās mazā terca (3 ladi). Minorā otrādi.','Pārslēdz karti starp C un Cm. Mainās viena nots: E kļūst par E♭.']},
 {id:'h9',b:'theory',st:3,t:'Apvērsumi uz 1-2-3 stīgām',tool:mp([0,'maj',1,'d'],[7,'maj',1,'d'],[2,'maj',1,'d']),how:['Trīs formas: pamatveids (basā pamattonis), 1. apvērsums (basā terca), 2. apvērsums (basā kvinta).','Spēlē visas pa grifu uz augšu un nosauc, kura nots ir basā.','Tas pats G un D mažoram.']},
 {id:'h10',b:'theory',st:3,t:'Minora apvērsumi uz 1-2-3 stīgām',tool:mp([9,'min',1,'d'],[4,'min',1,'d'],[2,'min',1,'d']),how:['Tās pašas trīs formas A minoram.','Salīdzini ar mažora formām: terca ir vienu ladu zemāk.','Tas pats Em un Dm.']},
 {id:'h11',b:'theory',st:3,t:'Apvērsumi uz 2-3-4 stīgām',tool:mp([0,'maj',2,'d'],[9,'min',2,'d']),how:['Tās pašas trīs formas vienu stīgu komplektu zemāk.','Formas izskatās citādi, jo starp 3. un 2. stīgu ir lielā terca, bet starp pārējām blakus stīgām kvarta.','Spēlē C mažoru un A minoru pa visu grifu.']},
 {id:'h12',b:'theory',st:3,t:'Harmonizētā mažora gamma',tool:mp([0,'maj',1,'d'],[2,'min',1,'d'],[4,'min',1,'d'],[5,'maj',1,'d'],[7,'maj',1,'d'],[9,'min',1,'d'],[11,'dim',1,'d']),how:['Uz katras C mažora pakāpes uzbūvē trijskani: C, Dm, Em, F, G, Am, B°.','Spēlē tos pēc kārtas uz 1-2-3 stīgām pa grifu uz augšu.','Jebkurā mažorā secība ir tā pati: mažors, minors, minors, mažors, mažors, minors, pamazinātais.']},
 {id:'h13',b:'theory',st:4,tool:{k:'circle',root:7,mode:'maj'},t:'Pakāpes ar romiešu cipariem',how:['I, IV un V ir mažora akordi. ii, iii un vi ir minora. vii° ir pamazinātais.','Nospēlē I–IV–V četrās tonalitātēs.','G: G, C, D. D: D, G, A. A: A, D, E. E: E, A, B.']},
 {id:'h14',b:'theory',st:4,tool:{k:'circle',root:9,mode:'maj'},t:'I–IV–V un 12 taktu blūzs',how:['A tonalitātē: A A A A, D D A A, E D A E. Katrs burts ir viena takts.','Spēlē ar bugī rifu no tehnikas bloka.','Tas pats E tonalitātē: E E E E, A A E E, B A E B.']},
 {id:'h15',b:'theory',st:4,t:'I–♭VII–IV',tool:mp([9,'mixo',0,'d']),how:['Mažorā 7. pakāpes akordu pazemina par pustoni. A tonalitātē tas ir G mažors.','Spēlē A–G–D, D–C–G un E–D–A.','Tā ir miksolīdiskā krāsa, ko tu jau zini: A miksolīdiskajā ir G, nevis G♯.']},
 {id:'h16',b:'theory',st:4,t:'Minora progresijas',tool:mp([9,'minor',0,'d']),how:['Dabiskā A minora akordi bez pamazinātā: Am, C, Dm, Em, F, G.','Spēlē Am–F–G un Am–G–F.','Virs katra akorda spēlē A minora pentatoniku un klausies, kura nots uz tā skan stabili.']},
 {id:'h17',b:'theory',st:4,t:'Mērķa notis',tool:mp([9,'min',0,'n'],[5,'maj',0,'n'],[7,'maj',0,'n']),how:['Progresija Am–F–G, katram akordam divas taktis.','Uz katras maiņas pirmā sitiena nospēlē jaunā akorda tercu: C, A, B.','Pa vidu spēlē ko gribi, bet uz maiņu trāpi precīzi.']},
 {id:'h18',b:'theory',st:5,t:'Modi kā vienas nots atšķirība',tool:mp([4,'lydian',0,'d'],[4,'mixo',0,'d'],[4,'dorian',0,'d'],[4,'phrygian',0,'d']),how:['Līdiskais ir mažors ar ♯4. Miksolīdiskais ir mažors ar ♭7.','Doriskais ir minors ar lielo sekstu. Frīģiskais ir minors ar ♭2.','Pārslēdz karti starp visiem četriem no E un atrodi noti, kas mainās.']},
 {id:'h19',b:'theory',st:5,t:'E līdiskais virs burdona',tool:mp([4,'lydian'],[4,'major']),how:['Ļauj skanēt atvērtai 6. stīgai.','Spēlē E līdisko un uzkavējies uz A♯.','Salīdzini ar parasto E mažoru, kur tajā vietā ir A.']},
 {id:'h20',b:'theory',st:5,t:'A doriskais',tool:mp([9,'dorian'],[9,'minPent']),how:['Akordi Am un D, katram viena takts.','Raksturīgā nots ir F♯.','Spēlē A minora pentatoniku un pieliec B un F♯.']},
 {id:'h21',b:'theory',st:5,t:'Raksturīgie akordu pāri',how:['Līdiskais: I–II, piemēram, E–F♯. Miksolīdiskais: I–♭VII, E–D.','Doriskais: i–IV, Em–A. Frīģiskais: i–♭II, Em–F.','Ieraksti katru pāri kā četru taktu cilpu un improvizē virs tā.']},
 {id:'h22',b:'theory',st:5,t:'E frīģiskais',tool:mp([4,'phrygian'],[4,'minor']),how:['Atvērta 6. stīga kā burdons.','Raksturīgā nots ir F, pustoni virs pamattoņa.','Salīdzini ar dabisko E minoru, kur tajā vietā ir F♯.']},
 {id:'h23',b:'theory',st:6,t:'Septakordi C mažorā',tool:mp([0,'maj7',0,'d'],[2,'min7',0,'d'],[7,'dom7',0,'d'],[11,'m7b5',0,'d']),how:['Trijskanim pieliec 7. pakāpi: Cmaj7, Dm7, Em7, Fmaj7, G7, Am7, Bm7♭5.','Katru spēlē kā arpedžo, pa vienai notij.','Klausies atšķirību starp Cmaj7 (lielā septima) un G7 (mazā septima).']},
 {id:'h24',b:'theory',st:6,t:'Harmoniskais minors',tool:mp([9,'harmMinor'],[4,'phrygDom'],[4,'dom7']),how:['A harmoniskais minors atšķiras no dabiskā ar vienu noti: G♯.','G♯ ir E7 akorda terca. Spēlē Am–E7 un virs E7 trāpi uz G♯.','No E tā pati gamma ir E frīģiskais dominantais.']},
 {id:'h25',b:'theory',st:6,t:'5/4 un 7/8',tool:{k:'metro',bpm:100,beats:5},how:['Metronomā pieci sitieni taktī. Skaiti 1-2-3, 1-2.','Spēlē rifu uz vienas nots, akcentējot 1. un 4. sitienu.','Tad septiņi sitieni: 1-2, 1-2, 1-2-3.']},
 {id:'h26',b:'theory',st:6,tool:{k:'circle',root:0,mode:'maj'},t:'Aizņemtie akordi',how:['C mažorā paņem akordus no C minora: A♭ (♭VI), B♭ (♭VII), Fm (iv).','Spēlē C–A♭–B♭–C un C–Fm–C.','Klausies, kā aizņemtais akords uz brīdi maina krāsu un tad atgriežas.']},
 /* --- Skaņdarbs --- */
 {id:'r1',b:'rep',st:1,bpm:1,t:'Darbs pie skaņdarba',how:['Paņem vienu sadaļu, ne visu skaņdarbu.','Sāc ar 60–70 % no mērķa tempa. Grūtākās divas taktis atkārto cilpā.','Trīs tīras reizes pēc kārtas, tad pieliec 5 BPM.']},
 /* --- Komponēšana --- */
 {id:'c1',b:'comp',st:1,t:'Melodija uz vienas stīgas',how:['Tikai 2. stīga, tikai C mažora notis.','Četras taktis. Sāc uz E (5. lads), beidz uz C.','Pieraksti notis ar nosaukumiem.']},
 {id:'c2',b:'comp',st:1,t:'Jautājums un atbilde',how:['A minora pentatonika. Divu taktu frāze, kas beidzas uz E vai G.','Divu taktu atbilde, kas beidzas uz A.','Nosauc abas beigu notis.']},
 {id:'c3',b:'comp',st:1,t:'Trīs notis, pārējais ir ritms',how:['Izvēlies trīs notis no E minora pentatonikas uz 6. un 5. stīgas.','Uztaisi divu taktu rifu. Notis nemaini, maini tikai ritmu un pauzes.','Labākais variants ir tas, kuru var atpazīt pēc ritma vien.']},
 {id:'c4',b:'comp',st:2,t:'Divas jaunās notis',how:['Četras taktis A minora pentatonikā.','Atkārto tās pašas četras taktis, bet divās vietās nomaini noti pret B vai F.','Pieraksti, kas mainījās noskaņā.']},
 {id:'c5',b:'comp',st:2,t:'Mažora melodija ar plānu',how:['G mažors, astoņas taktis.','Sāc uz B (terca), 4. taktī apstājies uz D (kvinta), beidz uz G.','Pa vidu izmanto visas septiņas notis vismaz vienreiz.']},
 {id:'c6',b:'comp',st:2,t:'Viena melodija, divas mājas',how:['Uzraksti četru taktu melodiju C mažorā virs C akorda.','Nospēlē tās pašas notis virs Am akorda.','Pielāgo beigu noti, lai tā justos kā mājas arī minorā.']},
 {id:'c7',b:'comp',st:3,t:'Rifs no apvērsumiem',how:['Akordi C–G–Am–F uz 1-2-3 stīgām.','Katram akordam izvēlies formu, kas ir vistuvāk iepriekšējai.','Pieliec ritmu un nospēlē kā četru taktu rifu.']},
 {id:'c8',b:'comp',st:3,t:'Melodija pa akorda skaņām',how:['Progresija Am–F–C–G, katram akordam viena takts.','Uz 1. un 3. sitiena tikai akorda skaņas: pamattonis, terca vai kvinta.','Pārējos sitienos jebkura A minora nots.']},
 {id:'c9',b:'comp',st:3,t:'Trijskanis virs basa nots',how:['Ļauj skanēt atvērtai 5. stīgai (A).','Virs tās spēlē G, A un D mažora trijskaņus uz 2-3-4 stīgām.','Izvēlies secību, kas patīk, un uztaisi četru taktu ievadu.']},
 {id:'c10',b:'comp',st:4,tool:{k:'circle',root:9,mode:'maj'},t:'Trīs akordi, divi rifi',how:['A tonalitāte, tikai A, D un E.','Panta rifs: zems, ar klusināšanu. Piedziedājuma rifs: atvērti akordi.','Ieraksti abus pēc kārtas.']},
 {id:'c11',b:'comp',st:4,tool:{k:'circle',root:9,mode:'maj'},t:'Rifs uz I–♭VII–IV',how:['Akordi A–G–D ar atvērtajām stīgām.','Divu taktu rifs, kur akords mainās astotdaļu pirms sitiena.','Virsū četru taktu melodija A miksolīdiskajā.']},
 {id:'c12',b:'comp',st:4,tool:{k:'circle',root:9,mode:'min'},t:'Minora progresija ar mērķi',how:['Am–F–G, katram akordam divas taktis.','Melodija, kas katrā maiņā trāpa uz akorda tercas: C, A, B.','Ieraksti akordus un melodiju atsevišķi.']},
 {id:'c13',b:'comp',st:4,t:'Solo ar plānu',how:['Paņem savu rifu no šī posma.','Astoņu taktu solo: divas taktis zemu, divas vidū, divas augstu, divas atpakaļ uz pamattoni.','Katras daļas pirmā nots ir akorda skaņa.']},
 {id:'c14',b:'comp',st:5,t:'Līdiskā ainava',how:['Atvērta 6. stīga kā burdons.','Astoņas taktis E līdiskajā. A♯ parādās vismaz trīs reizes kā gara nots.','Lēns temps, daudz vietas starp frāzēm.']},
 {id:'c15',b:'comp',st:5,t:'Viena bāze, divi modi',how:['E burdons. Četras taktis E līdiskajā, četras E miksolīdiskajā.','Pārejā izmanto notis, kas abos modos ir kopīgas.','Šo pieeju Satriani dēvē par pitch axis.']},
 {id:'c16',b:'comp',st:5,t:'Doriskais grūvs',how:['Cilpa Am7–D7, katram akordam viena takts.','Rifs un četru taktu melodija, kurā F♯ trāpa uz D7 akorda.','Temps ap 90 BPM.']},
 {id:'c17',b:'comp',st:5,t:'Frīģiskais rifs',how:['E frīģiskais uz 6. un 5. stīgas.','Smags rifs ar klusināšanu, kur akcentētā nots ir F (6. stīgas 1. lads).','Otrajā reizē beigās pieliec F akordu.']},
 {id:'c18',b:'comp',st:6,t:'Arpedžo tēma',how:['Cmaj7–Am7–Fmaj7–G7, katram akordam viena takts.','Melodija tikai no akordu skaņām.','Katrā maiņā pārej uz tuvāko nākamā akorda noti.']},
 {id:'c19',b:'comp',st:6,tool:{k:'metro',bpm:100,beats:5},t:'Rifs 5/4 metrā',how:['Metronomā pieci sitieni taktī.','Divu taktu rifs ar dalījumu 3+2.','Otrajā taktī apmaini dalījumu uz 2+3.']},

function markDirty(k){if(k==='settings')S.settings.updatedAt=Date.now();if(k==='works')S.works.updatedAt=Date.now();
  saveLocal();if(!Cloud.col)return;Cloud.dirty.add(k);clearTimeout(Cloud.timer);Cloud.timer=setTimeout(flush,2000)}
async function writeDoc(k){const ref=Cloud.col.doc(k);let body;
  if(k==='settings')body=S.settings;else if(k==='works')body=S.works;
  else{const m=k.slice(4);const r=await ref.get();if(r.exists){const d=r.data();if(mergeLog(m,clone(d.entries||[])))saveLocal()}body={entries:S.logs[m]||[]}}
  try{await ref.set(clone(body))}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+rand(600)));await ref.set(clone(body))}else throw e}}
async function flush(){if(Cloud.busy||!Cloud.col)return;Cloud.busy=true;setSync('saving');let k=null;
  try{while(Cloud.dirty.size){k=Cloud.dirty.values().next().value;Cloud.dirty.delete(k);await writeDoc(k)}setSync('ok')}
  catch(e){if(k)Cloud.dirty.add(k);setSync('error')}
  Cloud.busy=false}
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use){setSync('local');return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){setSync('local');return}
    const col=db.collection('data/users/'+id);
    const snap=await col.get();
    const seen=new Set();let changed=false;
    for(const d of snap.docs){seen.add(d.id);const data=clone(d.data()||{});
      if(d.id==='settings'){if((data.updatedAt||0)>(S.settings.updatedAt||0)){S.settings=normSettings(data);changed=true}else if((S.settings.updatedAt||0)>(data.updatedAt||0))Cloud.dirty.add('settings')}
      else if(d.id==='works'){if((data.updatedAt||0)>(S.works.updatedAt||0)){S.works=normWorks(data);changed=true}else if((S.works.updatedAt||0)>(data.updatedAt||0))Cloud.dirty.add('works')}
      else if(d.id.indexOf('log-')===0){const m=d.id.slice(4);const before=(S.logs[m]||[]).length;const added=mergeLog(m,data.entries||[]);if(added)changed=true;if(before+added>(data.entries||[]).length)Cloud.dirty.add(d.id)}}
    if(!seen.has('settings')&&S.settings.updatedAt)Cloud.dirty.add('settings');
    if(!seen.has('works')&&S.works.updatedAt)Cloud.dirty.add('works');
    for(const m of Object.keys(S.logs))if(!seen.has('log-'+m)&&S.logs[m].length)Cloud.dirty.add('log-'+m);
    Cloud.col=col;
    if(changed){AGG=null;saveLocal();M.bpm=S.settings.metro.bpm;M.beats=S.settings.metro.beats;M.vol=S.settings.metro.vol;if(!R.open)render()}
    if(Cloud.dirty.size)flush();else setSync('ok');
  }catch(e){setSync(Cloud.col?'error':'local')}
}

function allEntries(){const out=[];for(const m of Object.keys(S.logs))for(const e of S.logs[m])out.push(e);return out.sort((a,b)=>a.t-b.t)}
function agg(){if(AGG)return AGG;const days=new Map();
  for(const e of allEntries()){let d=days.get(e.d);if(!d){d={total:0,by:{}};days.set(e.d,d)}d.total+=e.s;d.by[e.b]=(d.by[e.b]||0)+e.s}

function addLog(e){const m=e.d.slice(0,7);(S.logs[m]||(S.logs[m]=[])).push(e);AGG=null;markDirty('log-'+m)}
function targets(){const g=S.settings.goal,tw=BLOCKS.reduce((a,b)=>a+b.w,0);let left=g;
  return BLOCKS.map((b,i)=>{const m=i===BLOCKS.length-1?left:Math.round(g*b.w/tw);left-=m;return m})}
function todayBy(){const d=agg().get(ymd());return d?d.by:{}}
function streaks(){const t=agg(),g=S.settings.goal*60,hit=d=>((t.get(d)||{}).total||0)>=g;
  let cur=0,d=ymd();if(!hit(d))d=addDays(d,-1);while(hit(d)){cur++;d=addDays(d,-1)}
  let best=0,run=0,prev=null;
  for(const k of Array.from(t.keys()).sort()){if(!hit(k)){continue}run=(prev&&dayNum(k)-dayNum(prev)===1)?run+1:1;prev=k;if(run>best)best=run}
  return {cur,best:Math.max(best,cur)}}
function pool(b){const st=S.settings.stage;let p=EX.filter(e=>e.b===b&&((b==='theory'||b==='comp')?e.st===st:e.st<=st));
  if(!p.length)p=EX.filter(e=>e.b===b&&e.st<=st);return p}
function exFor(b){const p=pool(b),d=ymd();if(S.settings.picks.d!==d)S.settings.picks={d};
  let e=p.find(x=>x.id===S.settings.picks[b]);
  if(!e){const off={tech:0,fret:3,theory:1,rep:0,comp:2}[b]||0;e=p[(dayNum(d)+off)%p.length]}
  return e}

  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02)}

function pluckAt(midi,delay,dur,vol){const c=actx();if(!c)return;const t=c.currentTime+delay,f=440*Math.pow(2,(midi-69)/12);

  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05)}

    if(f===0)s+=`<rect x="${X(0)-3}" y="${by}" width="6" height="${bh}" fill="var(--fb-nut)"/><rect x="${X(0)+3}" y="${by}" width="2" height="${bh}" fill="#000" fill-opacity=".35"/>`;
    else if(f<hi)s+=`<line x1="${X(f)+1.3}" x2="${X(f)+1.3}" y1="${by}" y2="${by+bh}" stroke="#000" stroke-opacity=".5" stroke-width="1.6"/><line x1="${X(f)}" x2="${X(f)}" y1="${by}" y2="${by+bh}" stroke="var(--fb-fret)" stroke-width="1.8"/>`;

    s+=`<line x1="${bx}" x2="${bx+bw}" y1="${y(i)}" y2="${y(i)}" stroke="var(--fb-${i<3?'wound':'string'})" stroke-width="${sw}" opacity="${op}"/>`;

  }
  if(o.barre)s+=`<rect x="${cx(o.barre.f)-6}" y="${y(5)-6}" width="12" height="${y(o.barre.from)-y(5)+12}" rx="6" fill="var(--fb-dot)" fill-opacity=".28"/>`;

  for(const sh of o.shapes||[])s+=`<polyline class="shape" points="${sh.map(c=>cx(c.f)+','+y(c.s)).join(' ')}"/>`;

  return s+'</svg>'}

const TR={host:null,metro:true,q:null,score:{n:0,ok:0,ms:0,streak:0},lock:false,beats:0,show:false,timer:null};
const trCfg=()=>S.settings.tr;
const pickName=pc=>SHARP[pc].length===1?SHARP[pc]:(Math.random()<.5?SHARP[pc]:FLAT[pc]);
function trCells(){const c=trCfg(),out=[];for(let i=0;i<6;i++){if(!c.strings[i])continue;

function trWeight(c){const st=S.settings.trainer[c.s+'-'+c.f];return st?1+3*(1-st[1])+Math.min(st[2]/1000,6)/2:4}
function trNext(){clearTimeout(TR.timer);TR.lock=false;const c=trCfg();
  if(c.mode==='drill'){const pcs=[];for(let p=0;p<12;p++){if((c.acc||SHARP[p].length===1)&&!(TR.q&&TR.q.pc===p))pcs.push(p)}
    const pc=pcs[rand(pcs.length)];TR.q={pc,name:pickName(pc)};TR.beats=0;TR.show=false;return trRender()}
  let cells=trCells();const prev=TR.q&&TR.q.cell;
  if(prev&&cells.length>1)cells=cells.filter(x=>!(x.s===prev.s&&x.f===prev.f));
  if(!cells.length){TR.q=null;return trRender()}
  let tot=0;const ws=cells.map(x=>{const w=trWeight(x);tot+=w;return w});let r=Math.random()*tot,i=0;while(i<cells.length-1&&(r-=ws[i])>0)i++;
  const cell=cells[i];TR.q={cell,pc:cell.pc,name:pickName(cell.pc),t0:performance.now(),fb:null};trRender()}
function trAnswer(ok,tap){if(TR.lock||!TR.q||!TR.q.cell)return;TR.lock=true;const q=TR.q,ms=Math.min(15000,performance.now()-q.t0);

  S.settings.trainer[k]=st?[st[0]+1,Math.round((st[1]*.75+v*.25)*1000)/1000,Math.round(st[2]*.75+ms*.25)]:[1,v,Math.round(ms)];
  const sc=TR.score;sc.n++;sc.ms+=ms;if(ok){sc.ok++;sc.streak++}else sc.streak=0;

// YIN pitch detection, then a second pass after a low-pass filter so the string's sharp upper partials
// (inharmonicity) do not pull the reading sharp. Tested on synthetic guitar tones: ~0.5 cent mean error.
function tuYin(buf,sr,minF,maxF){
  const N=buf.length,W=N>>1,tMin=Math.max(2,Math.floor(sr/maxF)),tMax=Math.min(W-2,Math.ceil(sr/minF));
  let rms=0;for(let i=0;i<N;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/N);if(rms<0.004)return null;
  const d=new Float32Array(tMax+2);
  for(let t=1;t<=tMax+1;t++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+t];s+=x*x}d[t]=s}
  const c=new Float32Array(tMax+2);c[0]=1;let run=0;
  for(let t=1;t<=tMax+1;t++){run+=d[t];c[t]=run>0?d[t]*t/run:1}
  let tau=-1;
  for(let t=tMin;t<=tMax;t++){if(c[t]<0.15){while(t+1<=tMax&&c[t+1]<c[t])t++;tau=t;break}}
  if(tau<0){let m=1e9;for(let t=tMin;t<=tMax;t++)if(c[t]<m){m=c[t];tau=t}if(m>0.4)return null}
  const s0=c[tau-1],s1=c[tau],s2=c[tau+1],den=s0-2*s1+s2;
  return {f:sr/(den?tau+(s0-s2)/(2*den):tau),conf:1-s1,rms}}

  let x1=0,x2=0,y1=0,y2=0;for(let i=0;i<buf.length;i++){const x=buf[i],y=b0*x+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=x;y2=y1;y1=y;out[i]=y}return out}

/* ================= 9. Session ================= */
const R={open:false,queue:[],qi:0,b:null,ex:null,elapsed:0,target:0,running:false,last:0,chimed:false,int:null,wake:null,clean:null,saved:0,piece:null};
const fmt=s=>{s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60)};
async function reqWake(){try{if('wakeLock' in navigator)R.wake=await navigator.wakeLock.request('screen')}catch(e){}}
function startSession(blocks){actx();R.queue=blocks;R.qi=0;R.open=true;$('#session').hidden=false;document.body.classList.add('in-session');
  const th=$('#toolHost');if(th)th.innerHTML='';loadBlock();clearInterval(R.int);R.int=setInterval(tick,250);reqWake()}
function loadBlock(){const b=R.queue[R.qi],i=BLOCKS.findIndex(x=>x.id===b),tg=targets()[i]*60,done=todayBy()[b]||0;
  R.b=b;R.ex=exFor(b);R.piece=b==='rep'?activePiece():null;R.target=done<tg-30?tg-done:tg;R.elapsed=0;R.running=true;R.last=Date.now();R.chimed=false;R.clean=null;R.saved=Date.now();
  if(M.on)mStop();const ex=R.ex,tool=ex.tool;

  else if(ex.bpm){const best=bestBpm(ex.id+(R.piece?':'+R.piece.id:''));setBpm(best||(ex.bpm>1?ex.bpm:(R.piece&&R.piece.bpm?Math.round(R.piece.bpm*.65):80)),true)}
  if(tool&&tool.k==='trainer'){const c=trCfg();c.mode=tool.mode;c.strings=tool.strings.slice();c.acc=!!tool.acc;c.maxFret=12;TR.q=null;TR.score={n:0,ok:0,ms:0,streak:0}}

  if(tool&&tool.k==='circle'){cfStop();CF.md=tool.mode==='maj'?'ion':'aeo';CF.axis=false;CF.k=tool.mode==='maj'?cIdx(tool.root):cIdx((tool.root+3)%12);CF.sel=null;CF.prog=[]}
  renderSession()}
function renderSession(){const b=BL[R.b],ex=R.ex,tool=ex.tool,el=$('#session');
  let extra='';

  if(ex.bpm){const best=bestBpm(ex.id+(R.piece?':'+R.piece.id:''));
    extra+=`<div class="note bpmlog"><div><b>Tīrais temps</b><br><span class="muted">Ātrākais temps, kurā šodien trīs reizes pēc kārtas sanāk bez kļūdām.</span></div>
      <div class="row"><span class="val" id="sClean">${R.clean?R.clean+' BPM':'—'}</span><button class="btn sm" data-act="s-clean" data-m="bpmbtn">Ierakstīt ${M.bpm} BPM</button></div>
      ${best?`<span class="muted">Līdzšinējais labākais: ${best} BPM</span>`:''}</div>`}
  if(R.b==='comp'){extra+=`<div class="stack-v" style="gap:10px"><label class="field">Idejas nosaukums<input id="sIdeaTitle" maxlength="80" autocomplete="off"></label>

function drawTimer(){const rem=R.target-R.elapsed,t=$('#sTime');if(!t)return;

function pendingObj(){const e={b:R.b,ex:R.ex.id,s:Math.round(R.elapsed),d:ymd(),t:Date.now()};if(R.piece)e.p=R.piece.id;return e}

  if(R.running){const dt=t-R.last;if(dt>0&&dt<20*60e3)R.elapsed+=dt/1000;if(!R.chimed&&R.elapsed>=R.target){R.chimed=true;chime()}

  'piece-active':t=>{S.works.pieces.forEach(p=>p.active=p.id===t.dataset.id);markDirty('works');renderWorks()},
  'piece-del':t=>{if(UI.del!==t.dataset.id){UI.del=t.dataset.id;return renderWorks()}S.works.pieces=S.works.pieces.filter(p=>p.id!==t.dataset.id);UI.del=null;markDirty('works');renderWorks()},
  'idea-rec':t=>{const x=S.works.ideas.find(i=>i.id===t.dataset.id);if(x){x.rec=!x.rec;markDirty('works');renderWorks()}},
  'idea-del':t=>{if(UI.del!==t.dataset.id){UI.del=t.dataset.id;return renderWorks()}S.works.ideas=S.works.ideas.filter(i=>i.id!==t.dataset.id);UI.del=null;markDirty('works');renderWorks()},
  's-pause':t=>{R.running=!R.running;R.last=Date.now();t.textContent=R.running?'Pauze':'Turpināt';drawTimer()},
  's-done':()=>finishBlock(true),
  's-close':()=>finishBlock(false),
  's-clean':()=>{R.clean=M.bpm;const el=$('#sClean');if(el)el.textContent=R.clean+' BPM'},
  export:async()=>{const data=JSON.stringify({app:'gitaras-stunda',v:1,exported:new Date().toISOString(),settings:S.settings,works:S.works,logs:S.logs},null,1);
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(dl){try{await dl.save({filename:'gitaras-stunda-'+ymd()+'.json',data});toast('Fails saglabāts.');return}catch(e){if(e&&e.code==='declined')return}}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='gitaras-stunda-'+ymd()+'.json';
      document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Fails lejupielādēts.');return}catch(e){}
    const out=$('#expOut');out.hidden=false;out.value=data;out.focus();out.select();
    try{await navigator.clipboard.writeText(data);toast('Dati nokopēti starpliktuvē.')}catch(e){toast('Nokopē tekstu no lauka zemāk.')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const fn=ACT[t.dataset.act];if(fn)fn(t,e)});
const ON={
  'm-range':t=>setBpm(+t.value),
  'm-beats':t=>setBeats(+t.value),
  'tu-tuning':t=>{TU.tuning=t.value;TU.lock=-1;TU.hist=[];tuSave();tuRender()},
  'an-fr':t=>{const fr=parseFr(t.value);if(!fr){toast('Ieraksti 6 vērtības, piemēram x32010 vai x 10 12 11 12 x.');return}AN.fr=fr;AN.pick=0;strumFrets(fr);setTimeout(anRender,0)},
  'map-root':t=>{MV.root=+t.value;MV.gi=0;mapRender()},
  'map-kind':t=>{MV.kind=t.value;MV.gi=0;mapRender()},
  'map-set':t=>{MV.set=+t.value;mapRender()},
  check:t=>{if(t.checked)S.settings.checks[t.dataset.k]=1;else delete S.settings.checks[t.dataset.k];markDirty('settings');renderPath()},
  import:t=>{const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||typeof v.logs!=='object')throw 0;let n=0;
        for(const m of Object.keys(v.logs)){if(!/^\d{4}-\d{2}$/.test(m)||!Array.isArray(v.logs[m]))continue;const a=mergeLog(m,v.logs[m]);if(a){n+=a;markDirty('log-'+m)}}
        if(v.settings&&(v.settings.updatedAt||0)>(S.settings.updatedAt||0)){S.settings=normSettings(v.settings);markDirty('settings')}
        if(v.works&&(v.works.updatedAt||0)>(S.works.updatedAt||0)){S.works=normWorks(v.works);markDirty('works')}
        saveLocal();M.bpm=S.settings.metro.bpm;M.beats=S.settings.metro.beats;M.vol=S.settings.metro.vol;render();toast('Importēts: '+n+' jauni ieraksti.')}
      catch(e){toast('Šis fails nav Ģitāras stundas eksports.')}};
    r.readAsText(f);t.value=''}
};
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;if(t.dataset.on==='m-range')ON['m-range'](t);else if(t.dataset.on==='m-vol')setVol(+t.value)});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.on)return;if(t.dataset.on==='m-vol'){setVol(+t.value);volPreview();return}if(t.dataset.on!=='m-range'&&ON[t.dataset.on])ON[t.dataset.on](t)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='piece'){const title=$('#pTitle').value.trim();if(!title)return;
    const secs=$('#pSecs').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,12).map(n=>({n:n.slice(0,30),st:0}));
    S.works.pieces.push({id:uid(),title:title.slice(0,80),artist:$('#pArtist').value.trim().slice(0,60),bpm:clamp(+$('#pBpm').value||0,0,300),sections:secs.length?secs:[{n:'Viss skaņdarbs',st:0}],active:!S.works.pieces.length,added:ymd()});
    markDirty('works');renderWorks();toast('Skaņdarbs pievienots.')}
  else{const title=$('#iTitle').value.trim();if(!title)return;
    S.works.ideas.unshift({id:uid(),d:ymd(),title:title.slice(0,80),note:$('#iNote').value.trim().slice(0,600),rec:false});markDirty('works');renderWorks();toast('Ideja pievienota.')}});
const KD={el:null,y:0,x:0,v:0};
document.addEventListener('pointerdown',e=>{const k=e.target.closest('[data-knob]');if(!k)return;e.preventDefault();KD.el=k;KD.y=e.clientY;KD.x=e.clientX;KD.v=M.bpm;try{k.setPointerCapture(e.pointerId)}catch(_){}k.focus({preventScroll:true})});
document.addEventListener('pointermove',e=>{if(!KD.el)return;setBpm(KD.v+((KD.y-e.clientY)+(e.clientX-KD.x)*0.6)/2.2,true)});
const kEnd=()=>{if(KD.el){KD.el=null;markDirty('settings')}};
document.addEventListener('pointerup',kEnd);document.addEventListener('pointercancel',kEnd);
document.addEventListener('wheel',e=>{const k=e.target.closest('[data-knob]');if(!k)return;e.preventDefault();setBpm(M.bpm+(e.deltaY<0?1:-1))},{passive:false});
document.addEventListener('keydown',e=>{if(!e.target.closest||!e.target.closest('[data-knob]'))return;const d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1,PageUp:5,PageDown:-5}[e.key];if(d){e.preventDefault();setBpm(M.bpm+d)}});
document.addEventListener('visibilitychange',()=>{if(!R.open)return;if(document.visibilityState==='visible')reqWake();else if(R.elapsed>=20)lsSet(LSP,pendingObj())});
window.addEventListener('pagehide',()=>{if(R.open&&R.elapsed>=20)lsSet(LSP,pendingObj())});

/* ================= 11. Boot ================= */
loadLocal();
M.bpm=S.settings.metro.bpm;M.beats=S.settings.metro.beats;M.vol=S.settings.metro.vol;
(function(){const p=lsGet(LSP);if(p&&p.s>=20&&p.b&&p.d){p.id=uid();addLog(p)}lsDel(LSP)})();
if(location.hash==='#tuner'){TOOL='tuner';TAB='tools'}
go(TAB);
cloudInit();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>

</body>
</html>
